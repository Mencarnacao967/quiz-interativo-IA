<body class="bg-slate-50 min-h-screen font-sans">

    <div class="max-w-3xl mx-auto py-10 px-4">
        <div id="quiz-header" class="hidden mb-8">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-indigo-600" id="progress-text">Pergunta 1 de X</span>
                <span class="text-sm font-bold text-indigo-600" id="score-preview"></span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <main id="app-container" class="bg-white rounded-2xl shadow-xl p-8 fade-in">
            
            <section id="screen-home" class="text-center">
                <div class="mb-6 text-indigo-600">
                    <i class="fas fa-graduation-cap text-6xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-4">Bem-vindo ao Questionário</h1>
                <p class="text-gray-600 mb-8">Avalia os teus conhecimentos sobre o Regulamento Interno de forma interativa.</p>
                
                <div class="flex flex-col gap-4 items-center">
                    <button onclick="startQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg font-semibold transition-all w-full max-w-xs">
                        Começar Agora
                    </button>

                    <div id="teacher-tools" class="mt-10 p-6 border-t border-dashed border-gray-200 w-full">
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Ferramentas de Gestão</h3>
                        <div class="flex flex-wrap justify-center gap-3">
                            <label id="import-zone" class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-md text-sm transition-all">
                                <i class="fas fa-upload mr-2"></i>Importar JSON
                                <input type="file" id="file-input" class="hidden" accept=".json">
                            </label>
                            <button onclick="exportToStudent()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-4 py-2 rounded-md text-sm font-medium transition-all">
                                <i class="fas fa-file-export mr-2"></i>Exportar para Alunos
                            </button>
                        </div>
                        <p id="file-status" class="text-xs text-gray-400 mt-2 italic"></p>
                    </div>
                </div>
            </section>

            <section id="screen-quiz" class="hidden">
                <div id="question-content">
                    </div>
                <div class="mt-8 flex justify-end">
                    <button id="btn-next" onclick="handleNext()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium hidden">
                        Próxima <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                    <button id="btn-submit" onclick="checkAnswer()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-medium">
                        Confirmar Resposta
                    </button>
                </div>
            </section>

            <section id="screen-results" class="hidden text-center">
                <div id="result-icon" class="text-6xl mb-4"></div>
                <h2 class="text-2xl font-bold mb-2" id="result-title">Concluído!</h2>
                <p class="text-gray-600 mb-6" id="result-text"></p>
                <div class="text-5xl font-black text-indigo-600 mb-8" id="final-score">0%</div>
                <button onclick="location.reload()" class="text-indigo-600 hover:underline font-medium">
                    Tentar Novamente
                </button>
            </section>

        </main>
    </div>

    <script id="main-logic">
        // --- Configuração e Estado ---
        const getEl = (id) => document.getElementById(id);
        
        let questions = [
            {
                type: "multiple",
                question: "De acordo com o Regulamento Interno, qual é o dever principal do aluno?",
                options: ["Chegar atrasado", "Respeitar a comunidade educativa", "Usar telemóvel na aula", "Ignorar as regras"],
                answer: 1
            },
            {
                type: "checkbox",
                question: "Quais destes são direitos dos alunos? (Selecione todos os corretos)",
                options: ["Ser tratado com respeito", "Participar na vida da escola", "Danificar material", "Ausentar-se sem justificação"],
                answer: [0, 1]
            },
            {
                type: "sequence",
                question: "Ordene a hierarquia de intervenção disciplinar (do menos grave para o mais grave):",
                options: ["Advertência", "Ordem de Saída", "Suspensão", "Expulsão"],
                answer: [0, 1, 2, 3] // Índices na ordem correta
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];

        // --- Inicialização ---
        window.onload = () => {
            const fileInput = getEl('file-input');
            if(fileInput) {
                fileInput.addEventListener('change', importJSON);
            }
        };

        function startQuiz() {
            if (questions.length === 0) return alert("Não existem perguntas carregadas.");
            showScreen('screen-quiz');
            getEl('quiz-header')?.classList.remove('hidden');
            renderQuestion();
        }

        function showScreen(screenId) {
            ['screen-home', 'screen-quiz', 'screen-results'].forEach(id => {
                const el = getEl(id);
                if(el) el.classList.add('hidden');
            });
            getEl(screenId)?.classList.remove('hidden');
        }

        // --- Renderização de Questões ---
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const container = getEl('question-content');
            if(!container) return;

            updateProgress();
            
            let html = `<h2 class="text-xl font-semibold text-gray-800 mb-6">${q.question}</h2>`;
            
            switch(q.type) {
                case 'multiple':
                    html += `<div class="space-y-3">` + q.options.map((opt, i) => `
                        <label class="flex items-center p-4 border-2 border-gray-100 rounded-xl cursor-pointer hover:border-indigo-200 transition-colors">
                            <input type="radio" name="q-opt" value="${i}" class="w-4 h-4 text-indigo-600">
                            <span class="ml-3 text-gray-700">${opt}</span>
                        </label>
                    `).join('') + `</div>`;
                    break;
                
                case 'checkbox':
                    html += `<div class="space-y-3">` + q.options.map((opt, i) => `
                        <label class="flex items-center p-4 border-2 border-gray-100 rounded-xl cursor-pointer hover:border-indigo-200 transition-colors">
                            <input type="checkbox" name="q-opt" value="${i}" class="w-4 h-4 text-indigo-600 rounded">
                            <span class="ml-3 text-gray-700">${opt}</span>
                        </label>
                    `).join('') + `</div>`;
                    break;

                case 'short':
                    html += `<input type="text" id="short-ans" placeholder="Escreve aqui a tua resposta..." class="w-full p-4 border-2 border-gray-200 rounded-xl focus:border-indigo-500 outline-none">`;
                    break;

                case 'match':
                    const shuffledPairs = [...q.pairs].sort(() => Math.random() - 0.5);
                    html += `<div class="space-y-4">` + q.left.map((item, i) => `
                        <div class="flex items-center gap-4">
                            <div class="w-1/2 p-3 bg-gray-50 rounded-lg text-sm">${item}</div>
                            <select class="match-select w-1/2 p-3 border rounded-lg text-sm" data-index="${i}">
                                <option value="">Selecionar...</option>
                                ${shuffledPairs.map(p => `<option value="${p}">${p}</option>`).join('')}
                            </select>
                        </div>
                    `).join('') + `</div>`;
                    break;

                case 'sequence':
                    const shuffledItems = q.options.map((opt, i) => ({opt, i})).sort(() => Math.random() - 0.5);
                    html += `<ul id="sortable-list" class="space-y-2">` + 
                        shuffledItems.map(item => `
                            <li class="p-4 bg-indigo-50 border border-indigo-100 rounded-lg cursor-move flex items-center" data-id="${item.i}">
                                <i class="fas fa-grip-vertical text-indigo-300 mr-4"></i>
                                ${item.opt}
                            </li>
                        `).join('') + `</ul>`;
                    break;
            }

            container.innerHTML = html;
            
            if(q.type === 'sequence') {
                new Sortable(getEl('sortable-list'), { animation: 150, ghostClass: 'sortable-ghost' });
            }

            getEl('btn-next')?.classList.add('hidden');
            getEl('btn-submit')?.classList.remove('hidden');
        }

        // --- Lógica de Validação ---
        function checkAnswer() {
            const q = questions[currentQuestionIndex];
            let isCorrect = false;

            if (q.type === 'multiple') {
                const selected = document.querySelector('input[name="q-opt"]:checked');
                if(!selected) return alert("Por favor, seleciona uma opção.");
                isCorrect = parseInt(selected.value) === q.answer;
            } 
            else if (q.type === 'checkbox') {
                const selected = Array.from(document.querySelectorAll('input[name="q-opt"]:checked')).map(el => parseInt(el.value));
                isCorrect = JSON.stringify(selected.sort()) === JSON.stringify(q.answer.sort());
            }
            else if (q.type === 'short') {
                const ans = getEl('short-ans')?.value.trim().toLowerCase();
                isCorrect = ans === q.answer.toLowerCase();
            }
            else if (q.type === 'match') {
                const selects = document.querySelectorAll('.match-select');
                const answers = Array.from(selects).map(s => s.value);
                isCorrect = JSON.stringify(answers) === JSON.stringify(q.right);
            }
            else if (q.type === 'sequence') {
                const order = Array.from(getEl('sortable-list').children).map(li => parseInt(li.dataset.id));
                isCorrect = JSON.stringify(order) === JSON.stringify(q.answer);
            }

            if(isCorrect) score++;
            
            // Feedback Visual Rápido
            getEl('app-container').classList.add(isCorrect ? 'ring-4' : 'ring-4');
            getEl('app-container').classList.add(isCorrect ? 'ring-emerald-500' : 'ring-red-500');
            
            getEl('btn-submit').classList.add('hidden');
            getEl('btn-next').classList.remove('hidden');
        }

        function handleNext() {
            getEl('app-container').classList.remove('ring-4', 'ring-emerald-500', 'ring-red-500');
            currentQuestionIndex++;
            if(currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const pct = ((currentQuestionIndex) / questions.length) * 100;
            const bar = getEl('progress-bar');
            const txt = getEl('progress-text');
            if(bar) bar.style.width = `${pct}%`;
            if(txt) txt.innerText = `Pergunta ${currentQuestionIndex + 1} de ${questions.length}`;
        }

        function showResults() {
            showScreen('screen-results');
            getEl('quiz-header')?.classList.add('hidden');
            const finalPct = Math.round((score / questions.length) * 100);
            
            const scoreEl = getEl('final-score');
            if(scoreEl) scoreEl.innerText = `${finalPct}%`;
            
            const titleEl = getEl('result-title');
            const iconEl = getEl('result-icon');
            
            if(finalPct >= 50) {
                if(titleEl) titleEl.innerText = "Excelente Trabalho!";
                if(iconEl) iconEl.innerHTML = "🎉";
                iconEl.className = "text-6xl mb-4 text-emerald-500";
            } else {
                if(titleEl) titleEl.innerText = "Podes Melhorar!";
                if(iconEl) iconEl.innerHTML = "📚";
                iconEl.className = "text-6xl mb-4 text-orange-500";
            }
        }

        // --- Gestão de Ficheiros ---
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    questions = JSON.parse(e.target.result);
                    getEl('file-status').innerText = `Sucesso: ${questions.length} perguntas carregadas.`;
                } catch (err) {
                    alert("Erro ao ler o ficheiro JSON.");
                }
            };
            reader.readAsText(file);
        }

        function exportToStudent() {
            const docClone = document.documentElement.cloneNode(true);
            const scriptTag = docClone.querySelector('#main-logic');
            
            // Injetar as perguntas atuais no clone
            let scriptContent = scriptTag.innerHTML;
            const questionsRegex = /let questions = \[[\s\S]*?\];/;
            const newQuestionsArray = `let questions = ${JSON.stringify(questions, null, 2)};`;
            scriptTag.innerHTML = scriptContent.replace(questionsRegex, newQuestionsArray);
            
            // Limpar UI de Professor
            const idsToRemove = ['import-zone', 'teacher-tools', 'file-status'];
            idsToRemove.forEach(id => {
                const el = docClone.querySelector(`#${id}`);
                if(el) el.remove();
            });

            const htmlContent = "<!DOCTYPE html>\n" + docClone.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'questionario_aluno.html';
            a.click();
        }
    </script>
